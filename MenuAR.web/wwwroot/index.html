<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MenuAR | Santo Burger</title>

    <link rel="stylesheet" href="/css/style.css">

    <!-- Meshopt decoder configuration -->
    <script>
        self.ModelViewerElement = self.ModelViewerElement || {};

        self.ModelViewerElement.meshoptDecoderLocation =
            "/js/meshopt_decoder.js";
    </script>

    <!-- Google model-viewer -->
    <script type="module"
            src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>
</head>

<body>

    <main class="menu-page">

        <!-- RESTAURANT HEADER -->
        <header class="restaurant-header">

            <h1>SANTO BURGER</h1>

        </header>


        <!-- CATEGORY NAVIGATION -->
        <nav class="category-bar">

            <a href="/menu">MENU</a>

            <a href="/menu/burgers">BURGERS</a>

            <a href="/menu/salads">SALADS</a>

            <a href="/menu/entries">ENTRIES</a>

        </nav>


        <!-- MENU -->
        <main id="menuContainer" class="menu-container">

            <!--
                Product categories and product cards
                will be generated here by app.js.
            -->

        </main>


    </main>


    <script src="/js/app.js"></script>

</body>

</html>
