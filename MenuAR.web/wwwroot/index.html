<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MenuAR | WebAR Demo</title>

    <link rel="stylesheet" href="/css/style.css">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <!-- Meshopt decoder -->
    <script src="/js/meshopt_decoder.js"></script>

    <!-- MindAR -->
    <script src="/js/mindar-image-aframe.prod.js"></script>
</head>

<body>

    <main>

        <h1>MenuAR</h1>

        <p>Interactive WebAR Restaurant Menu</p>

        <section>

            <h2>SANTO BURGER</h2>

            <p>
                Point your camera at the menu target.
            </p>

            <div class="model-viewer">

                <a-scene embedded
                         mindar-image="
                        imageTargetSrc: /assets/targets/menu-target.mind;
                        autoStart: true;
                        uiScanning: true;
                        uiLoading: true;
                    "
                         renderer="
                        colorManagement: true;
                        physicallyCorrectLights: true;
                    "
                         vr-mode-ui="enabled: false"
                         device-orientation-permission-ui="enabled: false">

                    <a-assets>

                        <a-asset-item id="santoBurgerModel"
                                      src="/assets/models/SantoBurger_AR_meshopt_v01.glb">
                        </a-asset-item>

                    </a-assets>


                    <!--
                        MindAR target

                        Everything inside this entity
                        will be attached to target #0.
                    -->

                    <a-entity mindar-image-target="targetIndex: 0">

                        <a-entity gltf-model="#santoBurgerModel"
                                  position="0 0 0.1"
                                  rotation="0 0 0"
                                  scale="0.5 0.5 0.5">
                        </a-entity>

                    </a-entity>


                    <a-camera position="0 0 0"
                              look-controls="enabled: false">
                    </a-camera>


                    <a-light type="ambient"
                             intensity="1.5">
                    </a-light>

                    <a-light type="directional"
                             position="2 4 3"
                             intensity="2">
                    </a-light>

                </a-scene>

            </div>

        </section>

    </main>

    <script src="/js/app.js"></script>

</body>
</html>
