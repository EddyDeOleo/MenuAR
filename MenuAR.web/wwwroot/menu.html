<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MenuAR | SANTO BURGER</title>

    <link rel="stylesheet" href="/css/style.css">

    <script type="module"
            src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>
</head>

<body>

    <header class="restaurant-header">
        <h1>SANTO BURGER</h1>
    </header>

    <nav class="category-nav">
        <a href="#burgers">BURGERS</a>
        <a href="#salads">SALADS</a>
        <a href="#entries">ENTRIES</a>
    </nav>

    <main class="menu">

        <section id="burgers">

            <article class="menu-card">

                <div class="menu-card-info">

                    <div>
                        <h2>CHEESE BOMB</h2>

                        <p class="description">
                            Premium burger
                            (cheddar cheese crust, bacon jam)
                        </p>
                    </div>

                    <div class="price">
                        $5.00
                    </div>

                </div>

                <div class="product-viewer">

                    <model-viewer src="/assets/models/SantoBurger_test_uncompressed.glb"
                                  alt="3D model of the Cheese Bomb burger"
                                  ar
                                  ar-modes="webxr scene-viewer quick-look"
                                  camera-controls
                                  auto-rotate
                                  shadow-intensity="1"
                                  exposure="1">

                    </model-viewer>

                </div>

                <div class="ar-action">

                    <button class="ar-button"
                            type="button"
                            onclick="openAR()">

                        VIEW IN AR

                    </button>

                </div>

            </article>

        </section>

    </main>

    <script src="/js/app.js"></script>

</body>
</html>
