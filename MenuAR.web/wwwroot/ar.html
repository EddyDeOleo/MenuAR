<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MenuAR | View in AR</title>

    <link rel="stylesheet" href="/css/ar.css">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <!-- Local Meshopt decoder -->
    <script src="/js/meshopt_decoder.js"></script>

    <!-- MindAR -->
    <script src="/js/mindar-image-aframe.prod.js"></script>
</head>

<body>

    <a href="/"
       class="back-button">
        ← Back to menu
    </a>


    <div class="ar-instructions">

        <p class="ar-label">
            MENUAR
        </p>

        <h1>
            Point your camera<br>
            at the menu
        </h1>

        <p>
            Move slowly until the burger appears.
        </p>

    </div>


    <a-scene mindar-image="
            imageTargetSrc: /assets/targets/menu-target.mind;
            autoStart: true;
            uiScanning: true;
            uiLoading: true;
        "
             embedded
             renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
        "
             vr-mode-ui="enabled: false"
             device-orientation-permission-ui="enabled: false">


        <a-assets>

            <a-asset-item id="santoBurgerModel"
                          src="/assets/models/SantoBurger_AR_meshopt_v01.glb">
            </a-asset-item>

        </a-assets>


        <!-- Image target -->

        <a-entity mindar-image-target="targetIndex: 0">

            <a-entity gltf-model="#santoBurgerModel"
                      position="0 0 0.1"
                      rotation="0 0 0"
                      scale="0.5 0.5 0.5">
            </a-entity>

        </a-entity>


        <a-camera position="0 0 0"
                  look-controls="enabled: false">
        </a-camera>


        <a-light type="ambient"
                 intensity="1.5">
        </a-light>

        <a-light type="directional"
                 position="2 4 3"
                 intensity="2">
        </a-light>

    </a-scene>


    <script src="/js/ar.js"></script>

</body>
</html>
