<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MenuAR | Santo Burger</title>

    <link rel="stylesheet"
          href="/css/style.css">

    <script type="module"
            src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

</head>


<body>

    <main class="menu-page">


        <!-- RESTAURANT HEADER -->

        <header class="restaurant-header">

            <h1>SANTO BURGER</h1>

        </header>


        <!-- CATEGORY BAR -->

        <nav class="category-bar">

            <span>BURGERS</span>

            <span>SALADS</span>

            <span>ENTRIES</span>

        </nav>


        <!-- PRODUCT CARD -->

        <section class="menu-card">


            <!-- PRODUCT INFORMATION -->

            <div class="product-header">

                <div class="product-info">

                    <h2>CHEESE BOMB</h2>

                    <p class="product-description">
                        Premium burger
                        (cheddar cheese crust, bacon jam)
                    </p>

                </div>


                <span class="product-price">
                    $5.00
                </span>

            </div>


            <!-- 3D MODEL -->

            <div class="product-viewer">

                <model-viewer id="cheeseBombViewer"
                              src="/assets/models/SantoBurger_test_uncompressed.glb"
                              alt="3D model of the Cheese Bomb burger"
                              ar
                              ar-modes="scene-viewer quick-look webxr"
                              ar-placement="floor"
                              camera-controls
                              shadow-intensity="1"
                              exposure="1"
                              interaction-prompt="auto">
                </model-viewer>


                <!-- CUSTOM AR BUTTON -->

                <button id="arButton"
                        class="ar-button"
                        type="button"
                        hidden>

                    VIEW IN AR

                </button>

            </div>


        </section>


    </main>


    <script src="/js/app.js"></script>

</body>

</html>
